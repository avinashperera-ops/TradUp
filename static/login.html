<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TradUp – Sign in</title>
<link rel="stylesheet" href="/static/style.css">
<style>body{display:grid;place-items:center;padding:20px}.box{width:min(420px,100%)}
.tabs{display:flex;background:var(--input);border-radius:999px;padding:4px;margin:22px 0}
.tabs button{flex:1;padding:11px;border-radius:999px;color:var(--mut)}.tabs button.on{background:linear-gradient(90deg,#8b5cf6,#6d28d9);color:#fff}
form{display:flex;flex-direction:column;gap:14px}form label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
.pill{border-radius:14px;padding:14px 16px}.g{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:999px;background:#fff;color:#1f1f1f;font-weight:600;text-decoration:none}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:13px;margin:18px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}</style></head>
<body><div class="card box">
 <div class="logo" style="padding:0"><i></i>TradUp</div>
 <div class="tabs"><button class="on" data-m="login">Log in</button><button data-m="signup">Sign up</button></div>
 <a class="g" id="g" href="/auth/google/login" hidden><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</a>
 <div class="or" id="or" hidden>or</div>
 <form id="f"><label id="nl" hidden>Full name<input class="pill" id="name" autocomplete="name"></label>
  <label>Email<input class="pill" id="email" type="email" required autocomplete="email"></label>
  <label>Password<input class="pill" id="pw" type="password" required minlength="8" autocomplete="current-password"><span id="hint" class="xs" hidden>At least 8 characters</span></label>
  <button class="btn" id="go">Log in</button><div class="err" id="err"></div></form></div>
<script>
let mode='login';const $=s=>document.querySelector(s);
fetch('/api/config').then(r=>r.json()).then(c=>{$('#g').hidden=$('#or').hidden=!c.google});
const q=new URLSearchParams(location.search).get('error');if(q)$('#err').textContent=q;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 $('#nl').hidden=$('#hint').hidden=mode==='login';$('#name').required=mode==='signup';
 $('#go').textContent=mode==='login'?'Log in':'Create account';$('#pw').autocomplete=mode==='login'?'current-password':'new-password';$('#err').textContent=''});
$('#f').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;$('#err').textContent='';
 const body={email:$('#email').value,password:$('#pw').value};if(mode==='signup')body.name=$('#name').value;
 try{const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Please check your email and password (min 8 characters).');
  location.href='/'}catch(x){$('#err').textContent=x.message}$('#go').disabled=false};
if(localStorage.getItem('theme')==='light')document.documentElement.dataset.theme='light';
</script></body></html>
